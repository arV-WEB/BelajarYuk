<header class="header-navbar">
    <!-- Hamburger toggle (mobile) -->
    <button class="sidebar-toggle-btn d-lg-none" onclick="toggleSidebar()" aria-label="Toggle sidebar">
        <i class="fa-solid fa-bars"></i>
    </button>

    <!-- Brand logo on mobile (hidden on desktop since sidebar shows it) -->
    <a href="{{ url_for('calendar_view') }}" class="mobile-brand d-lg-none">
        <i class="fa-solid fa-book-open"></i>
        <span>BelajarYuk</span>
    </a>

    <div class="breadcrumb-area d-none d-lg-flex">
        <a href="{{ url_for('dashboard') }}"><i class="fa-solid fa-house me-1"></i> Dashboard</a>
        <span class="breadcrumb-separator">/</span>
        <span class="fw-semibold" style="color: var(--color-primary);">{{ title }}</span>
    </div>
    
    <div class="search-bar d-none d-md-block">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="Search notes..." aria-label="Search">
    </div>
    
    <div class="header-actions">
        <!-- Search icon for mobile -->
        <button class="mobile-search-btn d-md-none" aria-label="Search">
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>

        <button class="notification-bell" aria-label="Notifications">
            <i class="fa-regular fa-bell"></i>
            <span class="notification-badge"></span>
        </button>
        
        <div class="user-profile-menu dropdown">
            <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle" id="userMenuLink" data-bs-toggle="dropdown" aria-expanded="false">
                {% if current_user.profile_pic %}
                    <img src="{{ url_for('static', filename='uploads/' + current_user.profile_pic) }}" alt="Avatar" class="user-avatar">
                {% else %}
                    <div class="user-avatar">
                        {{ current_user.full_name[0] | upper }}
                    </div>
                {% endif %}
                <div class="user-info ms-2 d-none d-sm-flex">
                    <span class="user-name">{{ current_user.full_name }}</span>
                    <span class="user-role">PREMIUM MEMBER</span>
                </div>
            </a>
            <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="userMenuLink">
                <li><a class="dropdown-item" href="{{ url_for('settings_view') }}"><i class="fa-solid fa-gear me-2"></i> Settings</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item text-danger" href="{{ url_for('logout') }}"><i class="fa-solid fa-arrow-right-from-bracket me-2"></i> Log Out</a></li>
            </ul>
        </div>
    </div>

    <!-- Mobile search bar (expandable) -->
    <div class="mobile-search-bar d-md-none" id="mobileSearchBar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="Search notes..." aria-label="Search">
        <button onclick="closeMobileSearch()" aria-label="Close search">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>
</header>
