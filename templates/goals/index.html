{% extends 'layout/base.html' %}

{% block content %}
<div class="page-header d-flex justify-content-between align-items-center flex-wrap gap-2">
    <div>
        <h1 class="page-title">Academic Goals</h1>
        <p class="page-subtitle">Track your semester objectives and achievements.</p>
    </div>
</div>

<div class="card-premium">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="m-0"><i class="fa-solid fa-graduation-cap me-2"></i>My Goals</h3>
        <button type="button" class="btn-premium btn-premium-primary" data-bs-toggle="modal" data-bs-target="#addGoalModal">
            <i class="fa-solid fa-plus"></i> Add Goal
        </button>
    </div>

    <div class="list-group" id="goalsList">
        <div class="text-center text-muted py-4">Loading goals...</div>
    </div>
</div>

<!-- Modal: Add Goal -->
<div class="modal fade" id="addGoalModal" tabindex="-1" aria-labelledby="addGoalModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg" style="border-radius: var(--border-radius); background-color: var(--bg-secondary);">
            <div class="modal-header border-bottom-0 pb-0">
                <h5 class="modal-title fw-bold" id="addGoalModalLabel">Add New Goal</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="addGoalForm">
                <div class="modal-body py-3">
                    <div class="form-group-premium">
                        <label for="goalTitle" class="form-label-premium">Goal Title</label>
                        <input type="text" class="form-control-premium" id="goalTitle" required placeholder="e.g. Achieve GPA >= 3.8">
                    </div>
                    <div class="row">
                        <div class="col-6">
                            <div class="form-group-premium">
                                <label for="goalCategory" class="form-label-premium">Category</label>
                                <select class="form-control-premium" id="goalCategory">
                                    <option value="Academic">Academic</option>
                                    <option value="Career">Career</option>
                                    <option value="Skill">Skill</option>
                                    <option value="Personal">Personal</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="form-group-premium">
                                <label for="goalTargetDate" class="form-label-premium">Target Date</label>
                                <input type="date" class="form-control-premium" id="goalTargetDate">
                            </div>
                        </div>
                    </div>
                    <div class="form-group-premium">
                        <label for="goalDescription" class="form-label-premium">Description (Optional)</label>
                        <textarea class="form-control-premium" id="goalDescription" rows="3" placeholder="Add details about this goal..."></textarea>
                    </div>
                    <div class="form-group-premium mb-0">
                        <label for="goalProgress" class="form-label-premium">Starting Progress: <span id="goalProgressValue">0</span>%</label>
                        <input type="range" class="form-range" id="goalProgress" min="0" max="100" value="0">
                    </div>
                </div>
                <div class="modal-footer border-top-0 pt-0">
                    <button type="button" class="btn-premium btn-premium-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn-premium btn-premium-primary">Add Goal</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal: Edit Goal -->
<div class="modal fade" id="editGoalModal" tabindex="-1" aria-labelledby="editGoalModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg" style="border-radius: var(--border-radius); background-color: var(--bg-secondary);">
            <div class="modal-header border-bottom-0 pb-0">
                <h5 class="modal-title fw-bold" id="editGoalModalLabel">Edit Goal</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="editGoalForm">
                <input type="hidden" id="editGoalId">
                <div class="modal-body py-3">
                    <div class="form-group-premium">
                        <label for="editGoalTitle" class="form-label-premium">Goal Title</label>
                        <input type="text" class="form-control-premium" id="editGoalTitle" required>
                    </div>
                    <div class="row">
                        <div class="col-6">
                            <div class="form-group-premium">
                                <label for="editGoalCategory" class="form-label-premium">Category</label>
                                <select class="form-control-premium" id="editGoalCategory">
                                    <option value="Academic">Academic</option>
                                    <option value="Career">Career</option>
                                    <option value="Skill">Skill</option>
                                    <option value="Personal">Personal</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="form-group-premium">
                                <label for="editGoalTargetDate" class="form-label-premium">Target Date</label>
                                <input type="date" class="form-control-premium" id="editGoalTargetDate">
                            </div>
                        </div>
                    </div>
                    <div class="form-group-premium">
                        <label for="editGoalDescription" class="form-label-premium">Description (Optional)</label>
                        <textarea class="form-control-premium" id="editGoalDescription" rows="3"></textarea>
                    </div>
                    <div class="form-group-premium mb-0">
                        <label for="editGoalProgress" class="form-label-premium">Progress: <span id="editGoalProgressValue">0</span>%</label>
                        <input type="range" class="form-range" id="editGoalProgress" min="0" max="100" value="0">
                    </div>
                </div>
                <div class="modal-footer border-top-0 pt-0 d-flex justify-content-between">
                    <button type="button" class="btn-premium btn-premium-danger" id="btnDeleteGoal"><i class="fa-solid fa-trash-can"></i> Delete</button>
                    <div>
                        <button type="button" class="btn-premium btn-premium-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn-premium btn-premium-primary">Save Changes</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function () {
    const goalsList = document.getElementById('goalsList');
    const addGoalModalEl = document.getElementById('addGoalModal');
    const editGoalModalEl = document.getElementById('editGoalModal');
    const addGoalModal = new bootstrap.Modal(addGoalModalEl);
    const editGoalModal = new bootstrap.Modal(editGoalModalEl);

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str == null ? '' : str;
        return div.innerHTML;
    }

    function formatDate(dateStr) {
        if (!dateStr) return '';
        const d = new Date(dateStr + 'T00:00:00');
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function progressBarClass(progress) {
        if (progress >= 100) return 'bg-success';
        if (progress >= 50) return 'bg-info';
        return 'bg-warning';
    }

    function loadGoals() {
        fetch('/api/goals')
            .then(res => res.json())
            .then(renderGoals)
            .catch(() => {
                goalsList.innerHTML = '<div class="text-center text-danger py-4">Failed to load goals.</div>';
            });
    }

    function renderGoals(goals) {
        if (!goals.length) {
            goalsList.innerHTML = '<div class="text-center text-muted py-4">No goals yet. Click "Add Goal" to create your first one.</div>';
            return;
        }

        goalsList.innerHTML = goals.map(goal => `
            <div class="list-group-item p-3 border-0 bg-light rounded mb-2 goal-item" data-id="${goal.id}" role="button">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <h5 class="text-primary mb-1">${escapeHtml(goal.title)}</h5>
                        <div class="d-flex align-items-center gap-2 flex-wrap">
                            <span class="badge bg-primary-subtle text-primary">${escapeHtml(goal.category)}</span>
                            ${goal.targetDate ? `<small class="text-secondary"><i class="fa-regular fa-calendar me-1"></i>${formatDate(goal.targetDate)}</small>` : ''}
                        </div>
                        ${goal.description ? `<p class="mb-0 mt-2 text-secondary">${escapeHtml(goal.description)}</p>` : ''}
                    </div>
                    <i class="fa-solid fa-pen text-secondary"></i>
                </div>
                <div class="progress mt-3" style="height: 10px;">
                    <div class="progress-bar ${progressBarClass(goal.progress)}" role="progressbar" style="width: ${goal.progress}%" aria-valuenow="${goal.progress}" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
                <div class="d-flex justify-content-between mt-1"><small class="text-secondary">Progress</small><small>${goal.progress}%</small></div>
            </div>
        `).join('');
    }

    // Add Goal: live progress label
    const goalProgressInput = document.getElementById('goalProgress');
    goalProgressInput.addEventListener('input', function () {
        document.getElementById('goalProgressValue').textContent = this.value;
    });

    // Edit Goal: live progress label
    const editGoalProgressInput = document.getElementById('editGoalProgress');
    editGoalProgressInput.addEventListener('input', function () {
        document.getElementById('editGoalProgressValue').textContent = this.value;
    });

    // Submit new goal
    document.getElementById('addGoalForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const payload = {
            title: document.getElementById('goalTitle').value,
            category: document.getElementById('goalCategory').value,
            targetDate: document.getElementById('goalTargetDate').value || null,
            description: document.getElementById('goalDescription').value,
            progress: parseInt(goalProgressInput.value, 10)
        };

        fetch('/api/goals', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(res => {
            if (!res.ok) throw new Error('Request failed');
            return res.json();
        })
        .then(() => {
            loadGoals();
            addGoalModal.hide();
            document.getElementById('addGoalForm').reset();
            document.getElementById('goalProgressValue').textContent = '0';
        })
        .catch(err => console.error(err));
    });

    // Open edit modal on goal click
    goalsList.addEventListener('click', function (e) {
        const item = e.target.closest('.goal-item');
        if (!item) return;
        const goalId = item.getAttribute('data-id');

        fetch('/api/goals')
            .then(res => res.json())
            .then(goals => {
                const goal = goals.find(g => String(g.id) === String(goalId));
                if (!goal) return;

                document.getElementById('editGoalId').value = goal.id;
                document.getElementById('editGoalTitle').value = goal.title;
                document.getElementById('editGoalCategory').value = goal.category;
                document.getElementById('editGoalTargetDate').value = goal.targetDate || '';
                document.getElementById('editGoalDescription').value = goal.description || '';
                document.getElementById('editGoalProgress').value = goal.progress;
                document.getElementById('editGoalProgressValue').textContent = goal.progress;

                editGoalModal.show();
            })
            .catch(err => console.error(err));
    });

    // Submit goal edits
    document.getElementById('editGoalForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const goalId = document.getElementById('editGoalId').value;
        const payload = {
            title: document.getElementById('editGoalTitle').value,
            category: document.getElementById('editGoalCategory').value,
            targetDate: document.getElementById('editGoalTargetDate').value || null,
            description: document.getElementById('editGoalDescription').value,
            progress: parseInt(document.getElementById('editGoalProgress').value, 10)
        };

        fetch('/api/goals/' + goalId, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(() => {
            loadGoals();
            editGoalModal.hide();
        })
        .catch(err => console.error(err));
    });

    // Delete goal
    document.getElementById('btnDeleteGoal').addEventListener('click', function () {
        const goalId = document.getElementById('editGoalId').value;
        if (!confirm('Are you sure you want to delete this goal?')) return;

        fetch('/api/goals/' + goalId, { method: 'DELETE' })
            .then(res => res.json())
            .then(() => {
                loadGoals();
                editGoalModal.hide();
            })
            .catch(err => console.error(err));
    });

    loadGoals();
});
</script>
{% endblock %}
